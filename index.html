<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Seguimiento de peso, plan de alimentación de 4 semanas y rutinas de entrenamiento adaptadas a tu equipo.">
  <meta name="theme-color" content="#F2F5F3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Equilibrio">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Equilibrio</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="visually-hidden-focusable salto" href="#vista">Saltar al contenido</a>
  <noscript><p class="error-carga">Equilibrio necesita JavaScript activado para funcionar.</p></noscript>

  <!-- Registro inicial: se muestra mientras no exista un perfil. -->
  <div id="onboarding" hidden></div>

  <!-- Aplicación -->
  <div id="app" hidden>
    <header class="app-topbar">
      <div class="app-topbar-interior">
        <a class="marca" href="#/inicio" aria-label="Equilibrio, ir al inicio">
          <svg class="marca-simbolo" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M5.5 13.5c2.2-1.8 4.3-1.8 6.5 0s4.3 1.8 6.5 0" fill="none" stroke="var(--app-accent)" stroke-width="2.5" stroke-linecap="round"/></svg>Equilibrio
        </a>
        <nav class="nav-escritorio" id="nav-escritorio" aria-label="Navegación principal"></nav>
      </div>
    </header>

    <main id="vista" class="app-main" tabindex="-1"></main>

    <nav class="app-tabbar" id="nav-movil" aria-label="Navegación principal"></nav>
  </div>

  <!-- Modal general: formularios y detalles -->
  <div class="modal fade" id="modal-app" tabindex="-1" aria-labelledby="modal-app-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="modal-app-titulo"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>
  </div>

  <!-- Modal de confirmación -->
  <div class="modal fade" id="modal-confirmar" tabindex="-1" aria-labelledby="modal-confirmar-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="modal-confirmar-titulo"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" data-confirmar>Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Avisos emergentes -->
  <div class="toast-container" id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
